
<div id="container" style="position:fixed; top:0%; left:0%;"></div>

<div id="info" style="position:absolute; top:800px; font-size: 50px;">
    <div id="fpsdisplay"></div>
    <div id="sizedisplay"></div>
</div>


<!-- Write to G-Buffer -->
<script id="gbuffer-vert" type="x-shader/x-vertex">
    in vec3 position;
    in vec2 uv;

    out vec4 Position;
    out vec4 LocalPosition;
    out mat4 mv;
 // out vec3 viewDir;

    uniform mat4 modelViewMatrix;
    uniform mat4 projectionMatrix;
    uniform mat4 modelMatrix;
    uniform vec3 cameraPosition;

    void main() {
        Position = modelViewMatrix * vec4( position, 1.0 );
        LocalPosition = vec4(position, 1);
        gl_Position = projectionMatrix * Position;
        mv = modelViewMatrix;
      // viewDir = (modelMatrix * vec4( position, 1.0 )).rgb - cameraPosition;
    }
  
</script>


<script type="module">

  import * as THREE from 'https://unpkg.com/three?module';

  import WebGL from 'https://unpkg.com/three/examples/jsm/capabilities/WebGL.js?module';

  import { OBJLoader } from 'https://unpkg.com/three/examples/jsm/loaders/OBJLoader.js?module';

  import { PLYLoader } from 'https://unpkg.com/three/examples/jsm/loaders/PLYLoader.js?module';

  import { OrbitControls } from 'https://unpkg.com/three/examples/jsm/controls/OrbitControls.js?module';


// modified from SNeRG

//the MLP
const NeuralTextureShaderFunctions = `
    precision mediump float;

    const int TENSORF_RAW_FEATURES = 48;
    const int TENSORF_OUT_FEATURES = 28;

    uniform vec3 bbox_low;
    uniform vec3 bbox_high;
    uniform vec3 tensorf_resolution;
    uniform mediump sampler3D samplerTensorfXY;
    uniform mediump sampler3D samplerTensorfYZ;
    uniform mediump sampler3D samplerTensorfXZ;
    uniform mediump sampler2D samplerTensorfZ;
    uniform mediump sampler2D samplerTensorfX;
    uniform mediump sampler2D samplerTensorfY;
    uniform mediump sampler2D samplerTensorfMLPWeights;

    in vec4 Position;
    in vec4 LocalPosition;
    in mat4 mv;

    out vec4 outColor;

    const float C0 = 0.28209479177387814;
    const float C1 = 0.4886025119029199;
    const float C2_0 = 1.0925484305920792;
    const float C2_1 = -1.0925484305920792;
    const float C2_2 = 0.31539156525252005;
    const float C2_3 = -1.0925484305920792;
    const float C2_4 = 0.5462742152960396;

    void main() {

      vec3 viewDir = Position.xyz;
      viewDir = normalize(transpose(mat3(mv)) * viewDir);

      vec3 xyz = LocalPosition.xyz;
      vec3 texcoord = (xyz - bbox_low) / (bbox_high - bbox_low);
      vec3 res = tensorf_resolution;

      texcoord = (texcoord * (res - vec3(1.0)) + 0.5) / res;

      const int TRF_SIZE = TENSORF_RAW_FEATURES / 4;
      const int TOF_SIZE = TENSORF_OUT_FEATURES / 4;

      // init first layer of mlp
      vec4 sh[TENSORF_OUT_FEATURES / 4];
      for (int i = 0; i < TENSORF_OUT_FEATURES / 4; ++i) {
        sh[i] = vec4(0.0);
      }

      for (float slice = 0.0; slice < float(TRF_SIZE); slice += 1.0) {
        vec4 xy = texture(samplerTensorfXY, vec3(texcoord.xy, (slice + 0.5) / float(TRF_SIZE)));
        vec4 z = texture(samplerTensorfZ, vec2(texcoord.z, (slice + 0.5) / float(TRF_SIZE)));
        vec4 t = xy * z;

        for (int i = 0; i < TOF_SIZE; ++i) {
          sh[i] += vec4(
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(slice, 4 * i    ), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(slice, 4 * i + 1), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(slice, 4 * i + 2), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(slice, 4 * i + 3), 0), t));
        }
      }

      for (float slice = 0.0; slice < float(TRF_SIZE); ++slice) {
        vec4 xz = texture(samplerTensorfXZ, vec3(texcoord.xz, (slice + 0.5) / float(TRF_SIZE)));
        vec4 y = texture(samplerTensorfY, vec2(texcoord.y, (slice + 0.5) / float(TRF_SIZE)));
        vec4 t = xz * y;

        for (int i = 0; i < TOF_SIZE; ++i) {
          sh[i] += vec4(
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(TRF_SIZE + int(slice), 4 * i    ), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(TRF_SIZE + int(slice), 4 * i + 1), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(TRF_SIZE + int(slice), 4 * i + 2), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(TRF_SIZE + int(slice), 4 * i + 3), 0), t));
        }
      }

      for (float slice = 0.0; slice < float(TRF_SIZE); ++slice) {
        vec4 yz = texture(samplerTensorfYZ, vec3(texcoord.yz, (slice + 0.5) / float(TRF_SIZE)));
        vec4 x = texture(samplerTensorfX, vec2(texcoord.x, (slice + 0.5) / float(TRF_SIZE)));
        vec4 t = yz * x;

        for (int i = 0; i < TOF_SIZE; ++i) {
          sh[i] += vec4(
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(2 * TRF_SIZE + int(slice), 4 * i    ), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(2 * TRF_SIZE + int(slice), 4 * i + 1), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(2 * TRF_SIZE + int(slice), 4 * i + 2), 0), t),
            dot(texelFetch(samplerTensorfMLPWeights, ivec2(2 * TRF_SIZE + int(slice), 4 * i + 3), 0), t));
        }
      }

      float b[9];

      float x = viewDir.x;
      float y = viewDir.y;
      float z = viewDir.z;
      float xx = x * x;
      float yy = y * y;
      float zz = z * z;
      float xy = x * y;
      float xz = x * z;
      float yz = y * z;

      b[0] = C0;
      b[1] = -C1 * y;
      b[2] = C1 * z;
      b[3] = -C1 * x;
      b[4] = C2_0 * xy;
      b[5] = C2_1 * yz;
      b[6] = C2_2 * (2.0 * zz - xx - yy);
      b[7] = C2_3 * xz;
      b[8] = C2_4 * (xx - yy);

      vec3 color = b[0] * vec3(sh[0].x, sh[2].y, sh[4].z)
                + b[1] * vec3(sh[0].y, sh[2].z, sh[4].w)
                + b[2] * vec3(sh[0].z, sh[2].w, sh[5].x)
                + b[3] * vec3(sh[0].w, sh[3].x, sh[5].y)
                + b[4] * vec3(sh[1].x, sh[3].y, sh[5].z)
                + b[5] * vec3(sh[1].y, sh[3].z, sh[5].w)
                + b[6] * vec3(sh[1].z, sh[3].w, sh[6].x)
                + b[7] * vec3(sh[1].w, sh[4].x, sh[6].y)
                + b[8] * vec3(sh[2].x, sh[4].y, sh[6].z);

       outColor = vec4(max(color + 0.5, 0.0), 1.0);
      //outColor = vec4(texture(samplerTensorfXZ, vec3(texcoord.xy, 0.5 / 12.0)).xy, 0.0, 1.0);
      // outColor = vec4(texture(samplerTensorfMLPWeights, texcoord.xy).xyz, 1.0);
// outColor = vec4(texture(samplerTensorfX, vec2(texcoord.x, 0.5 / 12.0)).xyz, 1.0);
    }


`;

/**
 * Creates shader code for the view-dependence MLP.
 *
 * This populates the shader code in NeuralTextureShaderFunctions with
 * network weights and sizes as compile-time constants. The result is returned
 * as a string.
 *
 * @param {!Object} scene_params
 * @return {string}
 */
function createNeuralTextureFunctions() {

  let fragmentShaderSource = NeuralTextureShaderFunctions;

  return fragmentShaderSource;
}


  let container;

  let camera, scene, renderer, controls;
  let renderTarget;
  let postScene, postCamera;

  let gLastFrame = window.performance.now();
  let oldMilliseconds = 1000;

  let gLoadedTexs = 0;
  let gLoadedPLYs = 0;

  const preset_size_w = 800;
  const preset_size_h = 800;
  const object_rescale = 0.1;

  init();

  function init() {

    const params = new URL(window.location.href).searchParams;
    const objname = params.get('obj');

    let scene_name = 'ficus';
    if (objname) {
      scene_name = objname;
    }

    if ( WebGL.isWebGL2Available() === false ) {
        document.body.appendChild( WebGL.getWebGL2ErrorMessage() );
        return;
    }

    container = document.getElementById( 'container' );
    renderer = new THREE.WebGLRenderer({
        powerPreference: 'high-performance',
        precision: 'highp',
    });
    renderer.setPixelRatio( 2 ); //supersampling
    renderer.setSize( preset_size_w, preset_size_h );
    renderer.setClearColor( new THREE.Color("rgb(255, 255, 255)"), 1.0 )
    container.appendChild( renderer.domElement );

    camera = new THREE.PerspectiveCamera( 39, preset_size_w/preset_size_h, 2*object_rescale, 10*object_rescale );
    camera.position.y = 2.0*object_rescale;
    camera.position.z = 3.464*object_rescale;
    camera.up = new THREE.Vector3(0, 0, 1);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.screenSpacePanning = true;



    scene = new THREE.Scene();

    let json;
    const urls = ['weights/'+scene_name+'_meta.json',
                  'weights/'+scene_name+'_TensorfXY.json',
                  'weights/'+scene_name+'_TensorfZ.json',
                  'weights/'+scene_name+'_TensorfXZ.json',
                  'weights/'+scene_name+'_TensorfY.json',
                  'weights/'+scene_name+'_TensorfYZ.json',
                  'weights/'+scene_name+'_TensorfX.json',
                  'weights/'+scene_name+'_TensorfMLPWeights.json'];
    Promise.all(
      urls.map(url =>
          fetch(url)
              .then(e => e.json())
          )
      ).then(data => {
        json = data.flat();

        let fragmentShaderSource = createNeuralTextureFunctions();

        let TensorfXY = new THREE.Data3DTexture( new Float32Array(json[1]["TensorfXY"].map(x => x.map(y => y.flat()).flat()).flat()), json[1]["size"][2], json[1]["size"][1], json[1]["size"][0] );
        let TensorfZ = new THREE.DataTexture( new Float32Array(json[2]["TensorfZ"].map(x => x.flat()).flat()), json[2]["size"][1], json[2]["size"][0] );
        let TensorfXZ = new THREE.Data3DTexture( new Float32Array(json[3]["TensorfXZ"].map(x => x.map(y => y.flat()).flat()).flat()), json[3]["size"][2], json[3]["size"][1], json[3]["size"][0] );
        let TensorfY = new THREE.DataTexture( new Float32Array(json[4]["TensorfY"].map(x => x.flat()).flat()), json[4]["size"][1], json[4]["size"][0] );
        let TensorfYZ = new THREE.Data3DTexture( new Float32Array(json[5]["TensorfYZ"].map(x => x.map(y => y.flat()).flat()).flat()), json[5]["size"][2], json[5]["size"][1], json[5]["size"][0] );
        let TensorfX = new THREE.DataTexture( new Float32Array(json[6]["TensorfX"].map(x => x.flat()).flat()), json[6]["size"][1], json[6]["size"][0] );
        let TensorfMLPWeights = new THREE.DataTexture( new Float32Array(json[7]["TensorfMLPWeights"].map(x => x.flat()).flat()), json[7]["size"][1], json[7]["size"][0] );
        TensorfMLPWeights.magFilter = THREE.NearestFilter;
        TensorfMLPWeights.minFilter = THREE.NearestFilter;

        [TensorfXY, TensorfZ, TensorfXZ, TensorfY, TensorfYZ, TensorfX].forEach(tex => {
          tex.format = THREE.RGBAFormat;
          tex.type = THREE.FloatType;
          tex.minFilter = tex.magFilter = THREE.LinearFilter;
          tex.unpackAlignment = 1;
          tex.needsUpdate = true;
        });

        TensorfMLPWeights.format = THREE.RGBAFormat;
        TensorfMLPWeights.type = THREE.FloatType;
        TensorfMLPWeights.unpackAlignment = 1;
        TensorfMLPWeights.needsUpdate = true;
        

        let newmat = new THREE.RawShaderMaterial({
            side: THREE.DoubleSide,
            vertexShader: document.querySelector( '#gbuffer-vert' ).textContent.trim(),
            fragmentShader: fragmentShaderSource,
            uniforms: {
              bbox_low: {value: json[0]["meta"]["bbox_low"]},
              bbox_high: {value: json[0]["meta"]["bbox_high"]},
              tensorf_resolution: {value: json[0]["meta"]["tensorf_resolution"]},
              samplerTensorfXY: { value: TensorfXY },
              samplerTensorfZ: { value: TensorfZ },
              samplerTensorfXZ: { value: TensorfXZ },
              samplerTensorfY: { value: TensorfY },
              samplerTensorfYZ: { value: TensorfYZ },
              samplerTensorfX: { value: TensorfX },
              samplerTensorfMLPWeights: { value: TensorfMLPWeights }
            },
            glslVersion: THREE.GLSL3
        });
        for ( let j = 0; j < 1; j ++ ) {
          new OBJLoader()
            .load('weights/'+scene_name+'.obj', function (object) {
              object.traverse(function (child) {
                if (child.type=='Mesh') {
                  child.material = newmat;
                }
              });
              gLoadedPLYs++;
              object.scale.x = object_rescale;
              object.scale.y = object_rescale;
              object.scale.z = object_rescale;
              scene.add(object);
          });
        }

    });

    window.addEventListener( 'resize', onWindowResize, false );
	  onWindowResize();

    animate();
  }

  function onWindowResize() {

    camera.aspect = preset_size_w/preset_size_h;
    camera.updateProjectionMatrix();

    renderer.setSize( preset_size_w, preset_size_h );

    document.getElementById('sizedisplay').innerHTML = "Size: "+(preset_size_w).toFixed(0)+"x"+(preset_size_h).toFixed(0);

    render();
  }

function updateFPSCounter() {
	let currentFrame = window.performance.now();
	let milliseconds = currentFrame - gLastFrame;
	let smoothMilliseconds = oldMilliseconds * (0.95) + milliseconds * 0.05;
	let smoothFps = 1000 / smoothMilliseconds;
	gLastFrame = currentFrame;
	oldMilliseconds = smoothMilliseconds;
	// if (gTotalOBJs==0 || gLoadedOBJs!=gTotalOBJs || gLoadedPNGs!=gTotalPNGs) {
	// 	document.getElementById('fpsdisplay').innerHTML = "Loaded OBJs: "+gLoadedOBJs.toFixed(0) + "/" + gTotalOBJs.toFixed(0) + "  Loaded PNGs: "+gLoadedPNGs.toFixed(0) + "/" + gTotalPNGs.toFixed(0);
	// }
	// else {
	// 	document.getElementById('fpsdisplay').innerHTML = "FPS: "+smoothFps.toFixed(1);
	// }
  document.getElementById('fpsdisplay').innerHTML = "FPS: "+smoothFps.toFixed(1);
}

  function animate() {

    requestAnimationFrame( animate );

    controls.update();

    render();

  }

  function render() {
    renderer.render( scene, camera );
    updateFPSCounter();
  }
</script>
